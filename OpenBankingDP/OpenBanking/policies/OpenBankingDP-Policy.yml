kind: DataPowerAssembly
apiVersion: api.ibm.com/v1
metadata:
  name: OpenBankingDP-Policy
  namespace: OpenBankingDP
  version: '1.0'
  tags: []
  labels:
    gatewayTypes:
      - datapower
spec:
  x-ibm-configuration:
    gateway: datapower-api-gateway
    assembly:
      execute:
        - gatewayscript:
            version: 2.0.0
            title: gatewayscript
            source: |-
              var aux=  context.get("request.path");
              console.error('AUX: '+aux);
        - invoke:
            version: 2.3.0
            title: invoke
            backend-type: detect
            header-control:
              type: blocklist
              values: []
            parameter-control:
              type: allowlist
              values: []
            http-version: HTTP/1.1
            timeout: 60
            verb: keep
            chunked-uploads: true
            persistent-connection: true
            cache-response: protocol
            cache-ttl: 900
            websocket-upgrade: false
            graphql-send-type: detect
            target-url: >-
              http://ir-02-small-http-cp4i.apps.itz-k0vfmt.hub01-lb.techzone.ibm.com$(request.path)
    phase: realized
    enforced: true
    testable: true
    cors:
      enabled: true
    activity-log:
      enabled: true
      success-content: payload
      error-content: payload
    buffering: true
