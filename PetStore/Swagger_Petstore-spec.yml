swagger: '2.0'
info:
  description: This is a sample server Petstore server.  You can find out more about
  version: 1.0.7
  title: Swagger Petstore
  termsOfService: http://swagger.io/terms/
  contact:
    email: apiteam@swagger.io
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
host: $(catalog.host)
basePath: /v2
tags:
  - name: pet
    description: Everything about your Pets
    externalDocs:
      description: Find out more
      url: http://swagger.io
schemes:
  - https
  - http
paths:
  /pet/{petId}:
    get:
      tags:
        - pet
      summary: Find pet by ID
      description: Returns a single pet
      operationId: getPetById
      produces:
        - application/json
      parameters:
        - name: petId
          in: path
          description: ID of pet to return
          required: true
          type: integer
          format: int64
      responses:
        '200':
          description: successful operation
          schema:
            $ref: '#/definitions/Pet'
        '400':
          description: Invalid ID supplied
        '404':
          description: Pet not found
definitions:
  Category:
    type: object
    properties:
      id:
        type: integer
      name:
        type: string
  PetBE:
    type: object
    required:
      - name
      - photoUrls
    properties:
      id:
        type: integer
      category:
        $ref: '#/definitions/Category'
      name:
        type: string
      photoUrls:
        type: array
        items:
          type: string
      tags:
        type: array
        items:
          $ref: '#/definitions/Tag'
      status:
        type: string
        description: pet status in the store
        enum:
          - available
          - pending
          - sold
  Pet:
    type: object
    required:
      - name
    properties:
      id:
        type: integer
      name:
        type: string
  Tag:
    type: object
    properties:
      id:
        type: integer
      name:
        type: string
externalDocs:
  description: Find out more about Swagger
  url: http://swagger.io
securityDefinitions:
  api-key:
    name: X-IBM-Client-Id
    in: header
    description: ''
    type: apiKey
security: []
