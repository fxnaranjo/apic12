kind: test
apiVersion: api.ibm.com/v1
metadata:
  name: TestCases
  namespace: PetStore
  version: '1.0'
  tags: []
spec:
  api:
    $endpoint: >-
      https://d-dev5237079.a-vir-s2.apiconnect.ipaas.ibmappdomain.cloud/dev5237079/fxn-catalog/v2
  request:
    - method: GET
      resource: /pet/{petId}
      headers:
        - key: accept
          value: application/json
      assertions:
        $ref: PetStore:GET-pet-0-200:1.0
    - method: GET
      resource: /pet/2
      headers:
        - key: accept
          value: application/json
      payload:
        raw:
          json: |-
            {
              "key": "invalid payload"
            }
      assertions:
        - $ref: PetStore:GET-pet-0-200:1.0
  environment:
    - $ref: PetStore:FxnEnv:1.0
